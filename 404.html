<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost ink — Rudraksha Tattooz</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/rudraksha-tattooz/assets/img/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cormorant+Garamond:ital@1&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0c0a09;--bone:#efe6d6;--ash:#8a8178;--sindoor:#d2361f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;text-align:center;background:var(--ink);color:var(--bone);font-family:"Cormorant Garamond",Georgia,serif;padding:24px 16px}
  h1{font-family:"Pirata One",serif;font-weight:400;font-size:clamp(6rem,30vw,16rem);line-height:.8;margin:0;color:transparent;-webkit-text-stroke:2px var(--bone)}
  p{font-style:italic;font-size:clamp(1.4rem,4vw,2.2rem);margin:18px 0 34px}
  p em{color:var(--sindoor)}
  a{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bone);background:var(--sindoor);padding:15px 26px;border-radius:999px;text-decoration:none}
  small{display:block;margin-top:26px;font-family:"JetBrains Mono",monospace;font-size:.65rem;letter-spacing:.14em;color:var(--ash);text-transform:uppercase}
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page never made it past the <em>stencil</em>.</p>
    <a href="/rudraksha-tattooz/">Back to the studio →</a>
    <small>Rudraksha Tattooz · Tezpur, Assam</small>
  </main>
